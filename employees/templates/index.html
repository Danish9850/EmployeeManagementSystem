<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            Employee Management System
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="row text-center">

        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3>👨‍💼</h3>
                    <h5>Employees</h5>
                    <a href="{% url 'employee_list' %}" class="btn btn-primary">Manage</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3>📋</h3>
                    <h5>Tasks</h5>
                    <a href="/tasks/" class="btn btn-success">Manage</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3>🏖️</h3>
                    <h5>Leaves</h5>
                    <a href="{% url 'leave_list' %}" class="btn btn-warning">Manage</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3>👤</h3>
                    <h5>Profiles</h5>
                    <a href="/profiles/" class="btn btn-info">Manage</a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
