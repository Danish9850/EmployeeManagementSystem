<html>
    <head>
        <title>Import Employees</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>

body{
    font-family:"Poppins",sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    min-height:100vh;
}

.import-card{

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    color:white;

}

.form-control{

    background:rgba(255,255,255,.12);
    color:white;
    border:1px solid rgba(255,255,255,.25);

}

.form-control:focus{

    background:rgba(255,255,255,.15);
    color:white;
    border-color:#4facfe;
    box-shadow:0 0 20px rgba(79,172,254,.5);

}

.form-label{

    font-weight:600;

}

</style>

    </head>

    <body>
        <div class="container mt-5">
        <div class="import-card p-5">
        <h2 class="text-center fw-bold mb-4">
            Import Employees
        </h2>

        <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
        <label class="form-label">
            Choose Excel File
        </label>
        <input type="file" name="excel_file" class="form-control" accept=".xlsx">
        </div>
        <div class="text-center">
        <button class="btn btn-success px-5">
            📤Upload
        </button>
        <a href="{% url 'download_sample' %}" class="btn btn-warning px-4">
            ⬇ Download Sample
        </a>
        <a href="{% url 'employee_list' %}" class="btn btn-secondary px-5">
            Back
        </a>

        <a href="{% url 'export_pdf' %}" class="btn btn-danger">
            <i class="bi bi-file-earmark-pdf-fill"></i>
            Export PDF
        </a>
        </div>
        </form>
        </div>
        </div>
    </body>
</html>
