<!DOCTYPE html>
<html>
<head>
    <title>
        {% if employee %}
            Update Employee
        {% else %}
            Add Employee
        {% endif %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            font-family:"Poppins",sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
            min-height:100vh;
        }

        .form-card{
            background:rgba(255,255,255,.12);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:25px;
            box-shadow:0 15px 40px rgba(0,0,0,.3);
            color:white;
        }

        .form-control,
        .form-select{
            background:rgba(255,255,255,0.12);
            border:1px solid rgba(255,255,255,0.25);
            color:#fff !important;
            border-radius:12px;
        }
        .form-control:focus,
        .form-select:focus{
            background:rgba(255,255,255,.15);
            color:#fff !important;
            border-color:#4facfe;
            box-shadow:0 0 25px rgba(79,172,254,.5);
        }

        .form-label{
            color:#ffffff;
            font-weight:600;
            margin-bottom:8px;
        }

    </style>
</head>

<body>

<div class="container mt-5">

    <div class="form-card p-5">

        <h2 class="text-center text-white fw-bold mb-4">

            {% if employee %}
               ✏️Update Employee
            {% else %}
               ➕ Add New Employee
            {% endif %}

        </h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ employee.name|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    name="email"
                    value="{{ employee.email|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Contact</label>
                <input
                    type="text"
                    class="form-control"
                    name="contact"
                    value="{{ employee.contact|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Experience</label>
                <input
                    type="text"
                    class="form-control"
                    name="experience"
                    value="{{ employee.experience|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input
                    type="number"
                    class="form-control"
                    name="salary"
                    value="{{ employee.salary|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>

                <select class="form-select" name="department">

                    <option value="HR"
                        {% if employee.department == "HR" %}selected{% endif %}>
                        HR
                    </option>

                    <option value="IT"
                        {% if employee.department == "IT" %}selected{% endif %}>
                        IT
                    </option>

                    <option value="Finance"
                        {% if employee.department == "Finance" %}selected{% endif %}>
                        Finance
                    </option>

                    <option value="Marketing"
                        {% if employee.department == "Marketing" %}selected{% endif %}>
                        Marketing
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">Photo</label>

                <input
                    type="file"
                    class="form-control"
                    name="photo">

                {% if employee.photo %}
                    <img
                        src="{{ employee.photo.url }}"
                        width="120"
                        class="rounded mt-3 border">
                {% endif %}

            </div>

            <div class="text-center mt-4">

                <button type="submit" class="btn btn-success px-5">

                    {% if employee %}
                        Update Employee
                    {% else %}
                        Save Employee
                    {% endif %}

                </button>

                <a href="{% url 'employee_list' %}" class="btn btn-secondary px-5">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
