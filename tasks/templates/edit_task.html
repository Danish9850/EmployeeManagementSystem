<html>
    <head>
<title>Edit Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body{
        font-family: Poppins sans-serif;
        background: linear-gradient(135deg, #0f172a,#1e3a8a,#2563eb);
        min-height: 100vh;
    }

    .navbar{
        box-shadow: 0 10px 30px rgba(0,0,0.35);
    }

    .glass-card{
        background: rgba(255,255,255,.12);
        backdrop-filter: blur(18px);
        border-radius: 22px;
        border: 1px solid rgba(255,255,255,.18);
        box-shadow: 0 15px 35px rgba(0,0,0.25);
        color: white;
    }

    .form-control,
    .form-select{
        background: rgba(255,255,255,.15);
        color: white;
        border: none;
    }

    .form-control:focus,
    .form-select:focus{
        background: rgba(255,255,255,.20);
        color: white;
        box-shadow: none;
    }

    .form-control::placeholder{
        color: #ddd;
    }

    label{
        font-weight: 600;
    }

    .btn-update{
        background: linear-gradient(135deg,#10b981,#34d399);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-weight: 600;
    }

    .btn-update:hover,
    .btn-back:hover{
        transform: translateY(-3px);
        color: white;
    }

    select option{
        background: #1e293b;
        color: white;
    }

</style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3" href="#">
                <i class="bi bi-list-check"></i>
                Task Management
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    Welcome,
                    <b>{{ request.user.username }}</b>
                </span>
                <a href="{% url 'logout' %}" class="btn btn-danger">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg=8">
                <div class="glass-card p-5">
                    <h2 class="text-center mb-4">
                        <i class="bi bi-pencil-square"></i>
                        Edit Task
                    </h2>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Employee</label>
                            <select name="employee" class="form-select">
                                {% for emp in employees %}
                                <option value="{{ emp.id }}" {% if emp.id == task.employee.id %}selected{% endif %}>
                                    {{ emp.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Task Title</label>
                            <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Description</label>
                            <textarea name="description" rows="4" class="form-control" required>
                                {{ task.description }}
                            </textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label>Priority</label>
                                <select name="priority" class="form-select">
                                    <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>
                                        Low
                                    </option>

                                    <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>
                                        Medium
                                    </option>    
                                        <option value="High" {% if task.priority == "High" %}selected{% endif %}>
                                        High
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label>Status</label>
                                <select name="status" class="form-select">
                                    <option value="Pending" {% if task.status == "Pending" %}selected{% endif %}>
                                        Pending
                                    </option>

                                    <option value="In Progress" {% if task.status == "Low" %}selected{% endif %}>
                                        In Progress
                                    </option>

                                    <option value="Completed" {% if task.status == "Completed" %}selected{% endif %}>
                                        Completed
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'task_list' %}" class="btn btn-back">
                                <i class="bi bi-arror-left"></i>
                                Back
                            </a>
                            <button type="submit" class="btn btn-update">
                                <i class="bi bi-check-circle-fill"></i>
                                Update Task
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
