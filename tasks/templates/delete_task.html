<html>
    <head>
        <title>Delete Task</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=
        swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
            body{
                font-family: 'Poppins',sans-serif;
                background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
                min-height: 100vh;
            }

            .glass-card{
                background: rgba(255,255,255,.12);
                backdrop-filter: blur(18px);
                border-radius: 22px;
                border: 1px solid rgba(255,255,255,.2);
                color: white;
                box-shadow: 0 15px 35px rgba(0,0,0,.25);
            }

            .delete-icon{
                font-size: 70px;
                color: #ef4444;
            }

            .btn-delete{
                background: linear-gradient(135deg,#dc2626,#ef4444);
                color: white;
                border: none;
                border-radius: 12px;
                padding: 12px 28px;
                font-weight: 600;
            }

            .btn-back{
                background: linear-gradient(135deg,#2563eb,#60a5fa);
                color: white;
                border: none;
                border-radius: 12px;
                padding: 12px 28px;
                font-weight: 600;
            }

            .btn-delete:hover,
            .btn-back:hover{
                transform: translateY(-3px);
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="glass-card p-5 text-center">
                        <i class="bi bi-trash-fill delete-icon"></i>
                        <h2 class="mt-3">Delete Task</h2>
                        <p class="mt-4">
                            Are you sure you want to delete
                            <strong>"{{ task.title }}</strong>
                        </p>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-3 mt-4">
                                <a href="{% url 'task_list' %}" class="btn btn-back">
                                    <i class="bi bi-arror-left"></i>
                                    Cancel
                                </a>
                                <button type="submit" class="btn btn-delete">
                                    <i class="bi bi-trash-fill"></i>
                                    Delete
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
