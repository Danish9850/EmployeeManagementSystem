<html>
    <head>
        <title>View Task</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <style>
            body{
                background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
                min-height: 100vh;
                font-family: Poppins, sans-serif;
            }

            .card{
                margin-top: 60px;
                border: none;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,3);
            }

            .card_header{
                background: #0d6efd;
                color: white;
                font-size: 28px;
                font-weight: bold;
                text-align: center;
            }

            .table th{
                width: 30%;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="card">
                <div class="card_header">
                    Task Details
                </div>

                <div class="card-body">

                    <table class="table table-bordered">
                        <tr>
                            <th>Employee</th>
                            <td>{{ task.employee.name }}</td>
                        </tr>

                        <tr>
                            <th>Title</th>
                            <td>{{ task.title }}</td>
                        </tr>

                        <tr>
                            <th>Description</th>
                            <td>{{ task.description }}</td>
                        </tr>

                        <tr>
                            <th>Priority</th>
                            <td>{{ task.priority }}</td>
                        </tr>

                        <tr>
                            <th>Status</th>
                            <td>{{ task.status }}</td>
                        </tr>

                    </table>
                    
                    <a href="{% url 'task_list' %}" class="btn btn-secondary">
                        Back
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
