<html>
    <head>
        <title>Add Task</title>
        <link href="https://cdn.jsdelivr.net/npm//\bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
    </head>

    <body class="bg-dark">
        <div class="container mt-5">
            <div class="card p-4 shadow">
                <h2 class="text-center mb-4">Add Task</h2>

                <form method="POST">
                    {% csrf_token %}

                    <label>Employee</label>
                    <select name="employee" class="form-select mb-3">
                        {% for emp in employees %}
                        <option value="{{ emp.id }}">
                            {{ emp.name }}
                        </option>
                        {% endfor %}
                    </select>

                    <label>Task Title</label>
                    <input type="text" name="title" class="form-control mb-3" required>

                    <label>Description</label>
                    <textarea name="description" class="form-control mb-3" rows="4"></textarea>

                    <label>Priority</label>
                    <select name="priority" class="form-select mb-3">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>

                    <label>Status</label>
                    <select name="status" class="form-select mb-4">
                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Completed</option>
                    </select>

                    <button class="btn btn-success">Save Task</button>
                    <a href="{% url 'task_list' %}" class="btn btn-secondary">
                        Back
                    </a>
                </form>
            </div>
        </div>        
    </body>
</html>
